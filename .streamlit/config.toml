[server]
fileWatcherType = "none"
runOnSave = false
enableStaticServing = true
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
magicEnabled = true